<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Get Code & Lọc Email (Cloud Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tích hợp thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .toast {
            visibility: hidden; min-width: 250px; background-color: #1f2937; color: #fff;
            text-align: center; border-radius: 8px; padding: 12px; position: fixed;
            z-index: 50; left: 50%; bottom: 30px; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s, bottom 0.3s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); font-weight: 500;
        }
        .toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4 md:p-8 text-gray-800 font-sans">

    <!-- PHẦN 1: TÀI KHOẢN VÀ GET CODE API (ĐỒNG BỘ ĐÁM MÂY) -->
    <div class="max-w-6xl mx-auto glass-panel rounded-2xl shadow-xl p-6 border border-gray-100 mb-8">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-indigo-700"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Hệ thống Get Code API (Đồng bộ Đám mây)</h1>
            <button onclick="clearAllAccounts()" class="bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded-lg transition text-sm">
                <i class="fa-solid fa-trash-can mr-1"></i> Xóa tất cả
            </button>
        </div>
        
        <div class="mb-6 bg-indigo-50 p-4 rounded-xl border border-indigo-100">
            <label class="block text-sm font-semibold text-indigo-900 mb-2">Nhập danh sách tài khoản (mail|pass|link_api)</label>
            <textarea id="accountInput" rows="3" class="w-full p-3 border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="uajdir2@gmail.com|3A9UaeQtU@|https://api.example.com/getcode"></textarea>
            
            <div class="mt-3 flex items-center justify-between">
                <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" id="useCorsProxy" class="w-4 h-4 text-indigo-600 border-gray-300 rounded mr-2" checked>
                    Dùng Proxy chống lỗi CORS
                </label>
                <button onclick="parseAccounts()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">
                    <i class="fa-solid fa-plus mr-1"></i> Thêm vào danh sách
                </button>
            </div>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-left border-collapse bg-white">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm">
                        <th class="p-3 border-b font-semibold w-10 text-center">STT</th>
                        <th class="p-3 border-b font-semibold">Email</th>
                        <th class="p-3 border-b font-semibold">Mật khẩu</th>
                        <th class="p-3 border-b font-semibold">Mã Code</th>
                        <th class="p-3 border-b font-semibold text-center w-20">Xóa</th>
                    </tr>
                </thead>
                <tbody id="accountTableBody">
                    <!-- Dữ liệu render từ Firebase -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- PHẦN 2: LỌC EMAIL HOTMAIL (CÔNG CỤ CỤC BỘ) -->
    <div class="max-w-6xl mx-auto glass-panel rounded-2xl shadow-xl p-6 border border-purple-100">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-purple-700"><i class="fa-solid fa-filter mr-2"></i>Trích xuất Email Nhanh</h1>
        </div>
        
        <div class="mb-6 bg-purple-50 p-4 rounded-xl border border-purple-100">
            <label class="block text-sm font-semibold text-purple-900 mb-2">Dán danh sách gốc (mail|pass|...)</label>
            <textarea id="filterInput" rows="3" class="w-full p-3 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none" placeholder="nguyenvana@hotmail.com|matkhau123|thongtinkhac..."></textarea>
            
            <div class="mt-3 text-right">
                <button onclick="parseFilter()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">
                    <i class="fa-solid fa-bolt mr-1"></i> Lọc lấy Email
                </button>
            </div>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200 relative">
            <button onclick="copyAllFiltered()" class="absolute top-2 right-2 bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition z-10">
                <i class="fa-regular fa-copy mr-1"></i> Copy Tất Cả
            </button>
            <table class="w-full text-left border-collapse bg-white">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm">
                        <th class="p-3 border-b font-semibold w-16 text-center">STT</th>
                        <th class="p-3 border-b font-semibold">Địa chỉ Email</th>
                        <th class="p-3 border-b font-semibold text-right w-32">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="filterTableBody">
                    <tr><td colspan="3" class="p-4 text-center text-gray-400 text-sm">Chưa có dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Thông báo Copy -->
    <div id="toast" class="toast"><i class="fa-solid fa-check-circle mr-2 text-green-400"></i><span id="toastMsg">Thành công!</span></div>

    <script>
        // CẤU HÌNH FIREBASE CỦA BẠN (ĐÃ TÍCH HỢP)
        const firebaseConfig = {
            apiKey: "AIzaSyDO2pCZ0SCv_3cFcQ0HiKPO1c2pSkmE-7w",
            authDomain: "tool-getcode-f5e0d.firebaseapp.com",
            databaseURL: "https://tool-getcode-f5e0d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tool-getcode-f5e0d",
            storageBucket: "tool-getcode-f5e0d.firebasestorage.app",
            messagingSenderId: "614158376202",
            appId: "1:614158376202:web:eda64d754ae85e335aeef3"
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const accountsRef = database.ref('accounts');

        // Lắng nghe dữ liệu thay đổi từ đám mây (Realtime)
        accountsRef.on('value', (snapshot) => {
            const tbody = document.getElementById('accountTableBody');
            tbody.innerHTML = '';
            
            const data = snapshot.val();
            if (!data) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400 text-sm">Chưa có tài khoản nào trên hệ thống...</td></tr>';
                return;
            }

            let index = 1;
            for (let id in data) {
                const acc = data[id];
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b transition";

                tr.innerHTML = `
                    <td class="p-3 text-center text-sm font-semibold text-gray-500">${index++}</td>
                    <td class="p-3">
                        <span class="font-medium">${acc.email}</span>
                        <button onclick="copyToClipboard('${acc.email}')" class="ml-2 text-xs text-indigo-500 hover:text-indigo-700 font-semibold"><i class="fa-regular fa-copy"></i></button>
                    </td>
                    <td class="p-3">
                        <span>${acc.password}</span>
                        <button onclick="copyToClipboard('${acc.password}')" class="ml-2 text-xs text-indigo-500 hover:text-indigo-700 font-semibold"><i class="fa-regular fa-copy"></i></button>
                    </td>
                    <td class="p-3 min-w-[250px]">
                        <button onclick="fetchCode('${id}', '${acc.apiUrl}')" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition">
                            <i class="fa-solid fa-rotate mr-1"></i> Lấy Code
                        </button>
                        <span class="ml-2 font-mono text-sm font-bold text-red-600" id="code-${id}">${acc.code || ''}</span>
                        ${acc.code ? `<button onclick="copyToClipboard('${acc.code}')" class="ml-2 text-xs text-indigo-500 hover:text-indigo-700 font-semibold"><i class="fa-regular fa-copy"></i></button>` : ''}
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="deleteAccount('${id}')" class="text-red-400 hover:text-red-600 transition p-1">
                            <i class="fa-solid fa-xmark fa-lg"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        });

        // Hàm thêm tài khoản lên Firebase
        function parseAccounts() {
            const input = document.getElementById('accountInput').value;
            if (!input.trim()) return;

            const lines = input.split('\n');
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length >= 3) {
                    const newAcc = {
                        email: parts[0].trim(),
                        password: parts[1].trim(),
                        apiUrl: parts.slice(2).join('|').trim(),
                        code: ''
                    };
                    accountsRef.push(newAcc); // Đẩy lên đám mây
                }
            });
            document.getElementById('accountInput').value = '';
            showToast("Đã thêm thành công!");
        }

        // Hàm xóa 1 tài khoản
        function deleteAccount(id) {
            if(confirm("Bạn có chắc chắn muốn xóa dòng này?")) {
                accountsRef.child(id).remove();
            }
        }

        // Hàm xóa tất cả
        function clearAllAccounts() {
            if(confirm("XÓA TẤT CẢ trên toàn hệ thống (cả PC và Điện thoại)?")) {
                accountsRef.remove();
            }
        }

        // Hàm Lấy Code và cập nhật lên Firebase
        async function fetchCode(id, url) {
            const useProxy = document.getElementById('useCorsProxy').checked;
            const fetchUrl = useProxy ? `https://corsproxy.io/?url=${encodeURIComponent(url)}` : url;
            
            const displaySpan = document.getElementById(`code-${id}`);
            displaySpan.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-gray-500"></i>';

            try {
                const response = await fetch(fetchUrl, { signal: AbortSignal.timeout(10000) });
                if (!response.ok) throw new Error("HTTP " + response.status);
                
                let data = await response.text();
                try { 
                    const json = JSON.parse(data); 
                    if(json.code) data = json.code; 
                } catch(e) {}

                // Cập nhật code lên Firebase để đồng bộ sang điện thoại
                accountsRef.child(id).update({ code: data });
                copyToClipboard(data);
                
            } catch (error) {
                console.error("Lỗi get code:", error);
                accountsRef.child(id).update({ code: "LỖI!" });
                alert("Lỗi khi lấy mã. Thử bật/tắt ô dùng Proxy rồi thử lại.");
            }
        }

        /* ================= CÔNG CỤ LỌC EMAIL (CỤC BỘ) ================= */
        let filteredEmails = [];
        
        function parseFilter() {
            const input = document.getElementById('filterInput').value;
            if (!input.trim()) return;
            
            const lines = input.split('\n');
            filteredEmails = [];
            
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts[0].trim()) filteredEmails.push(parts[0].trim());
            });
            
            renderFilterTable();
            document.getElementById('filterInput').value = '';
        }

        function renderFilterTable() {
            const tbody = document.getElementById('filterTableBody');
            tbody.innerHTML = '';
            
            if(filteredEmails.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400 text-sm">Chưa có dữ liệu...</td></tr>';
                return;
            }
            
            filteredEmails.forEach((email, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b";
                tr.innerHTML = `
                    <td class="p-3 text-center text-sm font-semibold text-gray-500">${index + 1}</td>
                    <td class="p-3 font-medium text-purple-700">${email}</td>
                    <td class="p-3 text-right">
                        <button onclick="copyToClipboard('${email}')" class="text-sm text-blue-500 hover:text-blue-700 font-semibold bg-blue-50 py-1 px-3 rounded">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function copyAllFiltered() {
            if(filteredEmails.length === 0) return alert("Không có email nào để copy!");
            copyToClipboard(filteredEmails.join('\n'));
        }

        /* ================= TIỆN ÍCH CHUNG ================= */
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Đã copy: ${text.substring(0, 20)}${text.length > 20 ? '...' : ''}`);
            }).catch(() => alert('Lỗi không thể copy!'));
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = message;
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }
    </script>
</body>
</html>
